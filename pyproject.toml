[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kaggle-tpu-inference"
version = "0.1.0"
description = "Crash-safe, hardware-aware Gemma inference on Kaggle TPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "YLiu95" }]
dependencies = [
  "huggingface-hub>=0.25",
  "httpx>=0.27",
  "psutil>=5.9",
  "rich>=13",
  "transformers>=4.45",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ktpu = "ktpu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ktpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

